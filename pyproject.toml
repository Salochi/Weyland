[project]
name = "weyland"
version = "0.1.0"
description = "Read-only personal finance aggregation (Plaid) and waterfall allocation planner."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
weyland = "weyland.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weyland"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
